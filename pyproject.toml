[project]
name = "long-horizon-platform"
version = "0.2.0"
description = "MCP server for long-horizon agents: task state and outcome-learning memory (memrouter)."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "mcp>=2.2,<3",
    "numpy>=1.26",
    "pydantic>=2.7",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
]

[project.optional-dependencies]
embeddings = ["fastembed>=0.4"]
dev = ["pytest>=8"]

[project.scripts]
horizon = "horizon.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/horizon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: needs HORIZON_TEST_PG_URL (Postgres with pgvector)"]
