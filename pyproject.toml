[project]
name = "long-horizon"
version = "0.3.0"
description = "memrouter, the long-horizon runner, and benchmarks (lab). Owner assistant: sibling owner-bot repo."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# the memory service's encoder (memrouter/memory_service.py Encoder)
model = ["torch", "transformers"]
# retraining the recall engine on LoCoMo (memrouter/finetune_embed.py, learned_recall.py)
train = ["torch", "transformers", "fastembed>=0.4"]
# Claude Code's memory over MCP (claude/embed_memory_mcp.py)
mcp = ["mcp>=2.2,<3"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
