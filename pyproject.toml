[project]
name = "long-horizon-platform"
version = "0.2.0"
description = "MCP server for long-horizon agents: task state and outcome-learning memory (memrouter)."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "mcp>=2.2,<3",
    "numpy>=1.26",
    "pydantic>=2.7",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
]

[project.optional-dependencies]
embeddings = ["fastembed>=0.4"]
# Decision-layer scorers (PROJECT.md §5): Jev via TypeSafe's SDK, the small-LLM comparison scorer via Claude.
decision = ["typesafe-sdk>=0.7,<1", "anthropic>=1.8,<2"]
# Parquet export of episodes for world-model training (MEMROUTER.md §4, §14).
export = ["pyarrow>=15"]
# The hosted server's account page and JSON API (PROJECT.md §10, §17).
web = ["fastapi>=0.115", "python-multipart>=0.0.9"]
bench = ["mini-swe-agent>=2.4,<3", "sb-cli>=0.1.5", "datasets>=3", "pyyaml>=6"]
dev = ["pytest>=8"]

[project.scripts]
horizon = "horizon.cli:main"
horizon-bench = "horizon.bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/horizon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: needs HORIZON_TEST_PG_URL (Postgres with pgvector)"]
